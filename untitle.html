<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Love Heart</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 800;
        const HEIGHT = 800;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        const SC = 21;
        const OY = 20;
        const DURATION = 10; 
        const ANIM_DURATION = 42; 
        const LIFT = 34;
        const GAP = 7;
        const SIZES = [9, 10, 11, 12];
        const BG = "#060208";
        const FLASH = [1.0, 0.78, 0.78];

        const PHRASES = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        class SeededRandom {
            constructor(seed) { this.seed = seed; }
            next() {
                let x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }
            uniform(min, max) { return min + this.next() * (max - min); }
            choice(arr) { return arr[Math.floor(this.uniform(0, arr.length))]; }
            shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(this.next() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
        }

        const rng = new SeededRandom(11);

        function heart(a) {
            let x = 16 * Math.pow(Math.sin(a), 3);
            let y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + OY];
        }

        let POLY = [];
        for (let i = 0; i < 720; i++) {
            POLY.push(heart(2 * Math.PI * i / 720));
        }

        let YMAX = Math.max(...POLY.map(p => p[1]));
        let YMIN = Math.min(...POLY.map(p => p[1]));
        let CY = (YMAX + YMIN) / 2;

        let EDGES = [];
        for (let i = 0; i < POLY.length; i++) {
            EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
        }

        function spans(y) {
            let xs = [];
            for (let [p1, p2] of EDGES) {
                let [x1, y1] = p1;
                let [x2, y2] = p2;
                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                    xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                }
            }
            xs.sort((a, b) => a - b);
            let res = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (i + 1 < xs.length) res.push([xs[i], xs[i+1]]);
            }
            return res;
        }

        function intersect(A, B) {
            let out = [];
            for (let a of A) {
                for (let b of B) {
                    let lo = Math.max(a[0], b[0]);
                    let hi = Math.min(a[1], b[1]);
                    if (hi - lo > 14) out.push([lo, hi]);
                }
            }
            return out;
        }

        function* phraseCycle() {
            while (true) {
                let order = [...PHRASES];
                rng.shuffle(order);
                for (let p of order) yield p;
            }
        }

        function measureTextWidth(text, size) {
            ctx.font = `bold ${size}px Arial`;
            return ctx.measureText(text).width;
        }

        function mathDist(x, y) {
            let dx = x / (16 * SC);
            let dy = (y - CY) / (14.5 * SC);
            return Math.hypot(dx, dy);
        }

        function mix(a, b, k) {
            return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        }

        function dim(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }

        function rgbString(c) {
            return `rgb(${Math.floor(Math.max(0, Math.min(1, c[0])) * 255)}, ${Math.floor(Math.max(0, Math.min(1, c[1])) * 255)}, ${Math.floor(Math.max(0, Math.min(1, c[2])) * 255)})`;
        }

        let cycle = phraseCycle();
        let row_h = 16;
        let half = row_h / 2;
        let placed = [];

        let y = YMAX - half;
        while (y > YMIN + half) {
            let row = intersect(spans(y + half), spans(y - half));
            for (let [lo, hi] of row) {
                lo += 4; hi -= 4;
                let cur = lo + rng.uniform(0, 8);
                let line = [];

                while (true) {
                    let fit = null;
                    for (let attempt = 0; attempt < 10; attempt++) {
                        let text = cycle.next().value;
                        let size = rng.choice(SIZES);
                        let w = measureTextWidth(text, size);
                        if (cur + w <= hi) {
                            fit = { text, size, w };
                            break;
                        }
                    }
                    if (!fit) break;
                    line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
                    cur += fit.w + GAP;
                }

                if (line.length === 0) continue;
                if (line.length > 1) {
                    let left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
                    for (let i = 0; i < line.length; i++) line[i].x += left * i / (line.length - 1);
                } else {
                    line[0].x = (lo + hi) / 2;
                }

                for (let i = 0; i < line.length; i++) {
                    placed.push({ x: line[i].x, y: y, text: line[i].text, size: line[i].size, edge: (i === 0 || i === line.length - 1) });
                }
            }
            y -= row_h;
        }

        let wine = [0.58, 0.0, 0.09];
        let crimson = [0.90, 0.05, 0.14];
        let blood = [0.98, 0.10, 0.16];

        for (let p of placed) {
            let rad = Math.min(1.0, mathDist(p.x, p.y));
            let base = mix(wine, crimson, 0.25 + 0.75 * rad);
            base = mix(base, blood, rng.uniform(0, 0.35) + (p.edge ? 0.3 : 0));
            p.color = base.map(v => Math.min(1, v));
            p.rad = rad;
        }

        let edges = placed.filter(p => p.edge);
        let inner = placed.filter(p => !p.edge);
        edges.sort((a, b) => (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - CY) % (2 * Math.PI)));
        inner.sort((a, b) => (-b.rad + rng.uniform(0, 0.08)) - (-a.rad + rng.uniform(0, 0.08)));

        let ORDER = [...edges, ...inner];
        let itemsIter = ORDER[Symbol.iterator]();
        let RATE = ORDER.length / (DURATION * 1000 / 16);
        let acc = 0.0;
        let spawning = true;
        let active = [];

        function spawn(p) {
            p.f = 0;
            p.dx = rng.uniform(-10, 10);
            active.push(p);
        }

        function clamp(v) { return Math.max(0.0, Math.min(1.0, v)); }
        const BGC = [6/255, 2/255, 8/255];

        function renderFrame() {
            ctx.fillStyle = BG;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.save();
            ctx.translate(WIDTH / 2, HEIGHT / 2);

            if (spawning) {
                acc += RATE;
                while (acc >= 1) {
                    acc -= 1;
                    let nextItem = itemsIter.next();
                    if (nextItem.done) { spawning = false; break; }
                    else { spawn(nextItem.value); }
                }
            }

            let nextActive = [];
            for (let p of active) {
                p.f++;
                let u = clamp(p.f / ANIM_DURATION);
                let e = 1 - Math.pow(1 - u, 3);
                let c = p.color;
                let x = p.x;
                let y = -p.y;
                let hover = (1 - e) * LIFT;
                let px = x + p.dx * (1 - e);
                let py = y - hover;

                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = rgbString(mix(BGC, dim(c, 0.30), e));
                ctx.fillText(p.text, px + 2, py + 3);

                ctx.font = `bold ${p.size + 1}px Arial`;
                ctx.fillStyle = rgbString(mix(BGC, dim(c, 0.20), e * e));
                ctx.fillText(p.text, px, py);

                let flashVal = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
                let col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flashVal);
                ctx.fillStyle = rgbString(col);
                ctx.fillText(p.text, px, py);

                nextActive.push(p);
            }
            active = nextActive;

            ctx.restore();
            requestAnimationFrame(renderFrame);
        }

        requestAnimationFrame(renderFrame);
    </script>
</body>
</html>
